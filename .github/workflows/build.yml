name: Build NidhiKernel

# Run from the Actions tab. "Use workflow from" picks the branch:
# nidhi builds the AOSP kernel, nidhi-miui the MIUI one.
on:
  workflow_dispatch:
    inputs:
      device:
        description: "Device (only alioth is officially supported)"
        type: choice
        options: [alioth, apollo, pipa]
        default: alioth
      kernel_name:
        description: "Kernel name in uname (4.19.325-<name>-<hash>)"
        type: string
        default: NidhiKernel
      ksu:
        description: "KernelSU (BakaSU) - CONFIG_KSU"
        type: boolean
        default: true
      ksu_susfs:
        description: "SuSFS (needs KernelSU) - CONFIG_KSU_SUSFS"
        type: boolean
        default: true
      nomount:
        description: "NoMount - CONFIG_NOMOUNT"
        type: boolean
        default: true
      bbg:
        description: "Baseband-guard - CONFIG_BBG"
        type: boolean
        default: true
      rekernel:
        description: "Re:Kernel - CONFIG_REKERNEL"
        type: boolean
        default: true
      droidspaces:
        description: "Droidspaces containers - CONFIG_DROIDSPACES"
        type: boolean
        default: true
      effcpu:
        description: "EFFCPU frequency tables - CONFIG_EFFCPU"
        type: boolean
        default: true
      effgpu:
        description: "EFFGPU 587 MHz cap - CONFIG_EFFGPU"
        type: boolean
        default: true
      kcompressd:
        description: "kcompressd - CONFIG_KCOMPRESSD"
        type: boolean
        default: true
      lz4_neon:
        description: "NEON LZ4 for zram - CONFIG_LZ4_ARM64_NEON"
        type: boolean
        default: true
      bbr:
        description: "BBRv3 by default - CONFIG_TCP_CONG_BBR"
        type: boolean
        default: true
      cpu_tune:
        description: "SM8250 code generation - CONFIG_ARM64_TUNE_SM8250"
        type: boolean
        default: true
      panel_90hz:
        description: "90 Hz mode, alioth only - CONFIG_K11A_PANEL_90HZ"
        type: boolean
        default: true
      dc_dimming:
        description: "DC dimming - CONFIG_DRM_SDE_EXPO"
        type: boolean
        default: true
      backlight_min:
        description: "Backlight minimum option - CONFIG_DRM_MSM_BACKLIGHT_MIN"
        type: boolean
        default: true
      boeffla:
        description: "Boeffla wakelock blocker - CONFIG_BOEFFLA_WL_BLOCKER"
        type: boolean
        default: true
      ntsync:
        description: "NTSync for Wine, usable by apps - CONFIG_NTSYNC"
        type: boolean
        default: true
      net_extras:
        description: "ipset, TTL/HL targets, tc connmark, CIFS"
        type: boolean
        default: true

permissions:
  contents: read

env:
  CLANG_URL: https://github.com/liliumproject/clang/releases/download/20250912/lilium_clang-20250912.tar.gz
  CLANG_KEY: lilium-clang-20250912

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      DEVICE: ${{ inputs.device }}
      KERNEL_NAME: ${{ inputs.kernel_name }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: string:lilium-clang-20250912
    steps:
      - name: Check out the kernel
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Fetch KernelSU history
        # BakaSU's version code is its commit count
        run: git -C KernelSU fetch --unshallow --tags || git -C KernelSU fetch --tags

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev libelf-dev \
            cpio zip ccache python3 lz4

      - name: Restore Clang
        id: clang
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/clang
          key: ${{ env.CLANG_KEY }}

      - name: Download Clang
        if: steps.clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/clang"
          curl -fsSL "$CLANG_URL" | tar -xz -C "$RUNNER_TEMP/clang"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ inputs.device }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ inputs.device }}-${{ github.ref_name }}-
            ccache-${{ inputs.device }}-

      - name: Pick the switches to turn off
        env:
          IN_KSU: ${{ inputs.ksu }}
          IN_KSU_SUSFS: ${{ inputs.ksu_susfs }}
          IN_NOMOUNT: ${{ inputs.nomount }}
          IN_BBG: ${{ inputs.bbg }}
          IN_REKERNEL: ${{ inputs.rekernel }}
          IN_DROIDSPACES: ${{ inputs.droidspaces }}
          IN_EFFCPU: ${{ inputs.effcpu }}
          IN_EFFGPU: ${{ inputs.effgpu }}
          IN_KCOMPRESSD: ${{ inputs.kcompressd }}
          IN_LZ4_ARM64_NEON: ${{ inputs.lz4_neon }}
          IN_TCP_CONG_BBR: ${{ inputs.bbr }}
          IN_ARM64_TUNE_SM8250: ${{ inputs.cpu_tune }}
          IN_K11A_PANEL_90HZ: ${{ inputs.panel_90hz }}
          IN_DRM_SDE_EXPO: ${{ inputs.dc_dimming }}
          IN_DRM_MSM_BACKLIGHT_MIN: ${{ inputs.backlight_min }}
          IN_BOEFFLA_WL_BLOCKER: ${{ inputs.boeffla }}
          IN_NTSYNC: ${{ inputs.ntsync }}
          IN_NET_EXTRAS: ${{ inputs.net_extras }}
        run: |
          off=
          for var in "${!IN_@}"; do
            [ "${!var}" = true ] || off="$off ${var#IN_}"
          done
          echo "DISABLE=${off# }" >> "$GITHUB_ENV"
          echo "Disabled:${off:- none}"

      - name: Build
        id: build
        env:
          CLANG_DIR: ${{ runner.temp }}/clang
          KBUILD_BUILD_USER: github
          KBUILD_BUILD_HOST: actions
        run: |
          ccache -z
          ./build.sh 2>&1 | tee "$RUNNER_TEMP/build.log"
          ccache -s | head -5

      - name: Summary
        env:
          ZIP_NAME: ${{ steps.build.outputs.zip_name }}
          RELEASE: ${{ steps.build.outputs.release }}
          VARIANT: ${{ steps.build.outputs.variant }}
        run: |
          {
            echo "### $ZIP_NAME"
            echo "- uname: \`$RELEASE\`"
            echo "- Branch: \`$GITHUB_REF_NAME\` ($VARIANT)"
            echo "- BakaSU version code: $(grep -m1 -o 'version code: [0-9]*' "$RUNNER_TEMP/build.log" 2>/dev/null || echo unknown)"
            echo "- Disabled: ${DISABLE:-none}"
            [ "$DEVICE" = alioth ] || echo "- **$DEVICE is not officially supported: this build may not boot.**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.zip_name }}
          path: ${{ steps.build.outputs.stage }}/
          if-no-files-found: error
