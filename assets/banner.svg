<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
  <title id="t">NidhiKernel</title>
  <desc id="d">NidhiKernel: custom kernel for POCO F3, Mi 11X and Redmi K40 (alioth, Snapdragon 870)</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#151a3a"/>
      <stop offset="1" stop-color="#2a1442"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1280" height="320" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="320" fill="url(#bg)"/>
    <rect width="1280" height="320" fill="url(#grid)"/>
    <circle cx="1060" cy="160" r="230" fill="url(#glow)"/>

    <!-- Chip: SM8250 package with traces -->
    <g transform="translate(960 70)" fill="none" stroke-linecap="round">
      <g stroke="#38bdf8" stroke-opacity="0.55" stroke-width="2">
        <path d="M0 40H-70l-20 20H-140"/>
        <path d="M0 90H-110"/>
        <path d="M0 140H-70l-20-20H-150"/>
        <path d="M180 40h60l20-20h40"/>
        <path d="M180 90h110"/>
        <path d="M180 140h60l20 20h30"/>
        <path d="M50 0v-40"/><path d="M90 0v-30l20-20"/><path d="M130 0v-45"/>
        <path d="M50 180v40"/><path d="M90 180v30l-20 20"/><path d="M130 180v45"/>
      </g>
      <g fill="#38bdf8" fill-opacity="0.8">
        <circle cx="-140" cy="60" r="4"/><circle cx="-110" cy="90" r="4"/><circle cx="-150" cy="120" r="4"/>
        <circle cx="300" cy="20" r="4"/><circle cx="290" cy="90" r="4"/><circle cx="290" cy="160" r="4"/>
      </g>
      <rect x="0" y="0" width="180" height="180" rx="18" fill="#0f172a" stroke="url(#accent)" stroke-width="3"/>
      <rect x="22" y="22" width="136" height="136" rx="10" fill="#111a33" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="90" y="86" text-anchor="middle" fill="#e2e8f0" stroke="none"
            font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700">SM8250</text>
      <text x="90" y="114" text-anchor="middle" fill="#94a3b8" stroke="none"
            font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" letter-spacing="1">SNAPDRAGON 870</text>
    </g>

    <!-- Title -->
    <g font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif">
      <text x="72" y="140" font-size="84" font-weight="800" fill="#f8fafc" letter-spacing="-1">Nidhi<tspan fill="url(#accent)">Kernel</tspan></text>
      <rect x="76" y="160" width="120" height="5" rx="2.5" fill="url(#accent)"/>
      <text x="74" y="206" font-size="26" fill="#cbd5e1">Custom kernel for POCO F3 · Mi 11X · Redmi K40</text>
      <text x="74" y="240" font-size="18" fill="#94a3b8" letter-spacing="0.5">alioth · Linux 4.19.325 · based on MagicTime</text>

      <!-- Feature chips -->
      <g font-size="15" font-weight="600" fill="#e2e8f0">
        <g transform="translate(74 262)">
          <rect width="150" height="30" rx="15" fill="#38bdf8" fill-opacity="0.14" stroke="#38bdf8" stroke-opacity="0.5"/>
          <text x="75" y="20" text-anchor="middle">BakaSU + SuSFS</text>
        </g>
        <g transform="translate(236 262)">
          <rect width="84" height="30" rx="15" fill="#818cf8" fill-opacity="0.14" stroke="#818cf8" stroke-opacity="0.5"/>
          <text x="42" y="20" text-anchor="middle">BBRv3</text>
        </g>
        <g transform="translate(332 262)">
          <rect width="76" height="30" rx="15" fill="#a78bfa" fill-opacity="0.14" stroke="#a78bfa" stroke-opacity="0.5"/>
          <text x="38" y="20" text-anchor="middle">90 Hz</text>
        </g>
        <g transform="translate(420 262)">
          <rect width="118" height="30" rx="15" fill="#c084fc" fill-opacity="0.14" stroke="#c084fc" stroke-opacity="0.5"/>
          <text x="59" y="20" text-anchor="middle">DC dimming</text>
        </g>
        <g transform="translate(550 262)">
          <rect width="96" height="30" rx="15" fill="#e879f9" fill-opacity="0.14" stroke="#e879f9" stroke-opacity="0.5"/>
          <text x="48" y="20" text-anchor="middle">EFFCPU</text>
        </g>
      </g>
    </g>
  </g>
</svg>
